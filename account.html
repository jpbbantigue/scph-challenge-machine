<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account — Prompt Royale</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
:root{
  --bg-0:#05070d;
  --ink:#F3F5FC;
  --ink-75:rgba(243,245,252,0.75);
  --ink-65:rgba(243,245,252,0.65);
  --ink-58:rgba(243,245,252,0.58);
  --ink-50:rgba(243,245,252,0.5);
  --ink-40:rgba(243,245,252,0.4);
  --royal-deep:#1836B2;
  --royal:#295BFF;
  --royal-hi:#4D7CFF;
  --crimson-deep:#74182D;
  --crimson:#B51F3E;
  --crimson-hi:#E63A46;
  --gold-deep:#C68B24;
  --gold:#F4BF3A;
  --gold-hi:#FFD978;
  --font-display:'Space Grotesk',sans-serif;
  --font-mono:ui-monospace,'SF Mono',Menlo,monospace;
  --font-body:'Inter',sans-serif;
}
html,body{margin:0;padding:0;}
body{background:var(--bg-0);color:var(--ink-65);font-family:var(--font-body);min-height:100vh;-webkit-font-smoothing:antialiased;}
a{color:var(--royal-hi);text-decoration:none;}
a:hover{color:var(--gold-hi);}
button{font-family:inherit;}

.back-link{font-size:13px;color:var(--ink-50);display:inline-block;margin-bottom:14px;text-decoration:none;}
.back-link:hover{color:var(--ink);}

.layout{max-width:1100px;margin:0 auto;padding:32px 24px 80px;display:grid;grid-template-columns:240px 1fr;gap:32px;}
@media (max-width:800px){.layout{grid-template-columns:1fr;}}

.sidebar{position:sticky;top:24px;align-self:start;border-radius:20px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);padding:20px 16px;display:flex;flex-direction:column;gap:18px;}
.side-head{display:flex;align-items:center;gap:10px;padding:0 4px;}
.avatar-big{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--royal-hi),var(--royal-deep));display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:14px;color:#fff;flex:none;}
.side-head-text{min-width:0;}
.side-name{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.side-handle{font-size:11px;color:var(--ink-50);margin-top:1px;}
.side-credits{font-size:11px;color:var(--gold);font-weight:600;}
.side-credits-bar{height:5px;border-radius:999px;background:rgba(255,255,255,0.08);overflow:hidden;margin-top:8px;}
.side-credits-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-deep));border-radius:999px;}
.tier-badge{display:inline-block;padding:1px 7px;border-radius:999px;background:rgba(244,191,58,0.16);border:1px solid rgba(244,191,58,0.35);color:var(--gold-hi);font-size:9.5px;font-weight:700;letter-spacing:0.04em;vertical-align:middle;}
.side-nav{display:flex;flex-direction:column;gap:2px;}
.side-nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:none;background:none;color:var(--ink-65);font-size:13.5px;font-weight:500;cursor:pointer;}
.side-nav button .nav-glyph{width:8px;height:8px;flex:none;}
.side-nav button:hover{background:rgba(255,255,255,0.05);color:var(--ink);}
.side-nav button.active{background:rgba(41,91,255,0.14);color:var(--ink);font-weight:600;}
.sidebar hr{border:none;border-top:1px solid rgba(255,255,255,0.08);margin:0;}
.signout-btn{width:100%;padding:9px 12px;border-radius:10px;border:none;background:none;color:#FF9AA5;font-size:13px;font-weight:600;text-align:left;cursor:pointer;}
.signout-btn:hover{background:rgba(230,58,70,0.08);}

.panel{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:24px;margin-bottom:20px;}
.panel h2{font-family:var(--font-display);font-size:16px;font-weight:600;color:var(--ink);margin:0 0 4px;}
.panel .sub{font-size:12.5px;color:var(--ink-50);margin:0 0 18px;}
.field-label{display:block;font-family:var(--font-display);font-size:11px;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-40);margin:14px 0 5px;}
.field-label:first-of-type{margin-top:0;}
input[type=text],input[type=url],textarea,select{
  width:100%;background:rgba(255,255,255,0.04);color:var(--ink);border:1px solid rgba(255,255,255,0.14);border-radius:10px;
  padding:10px 12px;font-family:inherit;font-size:13.5px;
}
textarea{resize:vertical;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--royal-hi);}
.hint{font-size:11.5px;color:var(--ink-40);margin-top:5px;}
.char-count{font-size:11px;color:var(--ink-40);text-align:right;margin-top:3px;}
.btn{padding:9px 18px;border-radius:999px;border:none;background:var(--gold);color:#241a02;font-size:13px;font-weight:600;cursor:pointer;margin-top:12px;}
.btn:hover{background:var(--gold-hi);}
.btn.secondary{background:rgba(255,255,255,0.06);color:var(--ink);border:1px solid rgba(255,255,255,0.14);}
.btn.danger{background:rgba(230,58,70,0.12);color:#FF9AA5;border:1px solid rgba(230,58,70,0.35);}
.btn.small{padding:6px 12px;font-size:12px;margin-top:0;}
.btn-primary{padding:9px 18px;border-radius:999px;border:none;background:linear-gradient(135deg,#295BFF,#1836B2);color:#fff;font-size:13px;font-weight:600;cursor:pointer;margin-top:12px;}
.btn-primary:hover{background:linear-gradient(135deg,#3A6BFF,#2142C4);}
.btn-primary.small{padding:6px 12px;font-size:12px;margin-top:0;}
.hint-gold{font-size:11.5px;color:var(--gold-hi);margin:0 0 8px;}
.banner-slot,.avatar-slot{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.03);border:1px dashed rgba(255,255,255,0.14);color:var(--ink-40);font-size:12.5px;cursor:pointer;}
.avatar-slot{font-size:11px;}
.banner-slot:hover,.avatar-slot:hover{background:rgba(255,255,255,0.05);color:var(--ink-50);}
.status-msg{font-size:12px;color:var(--ink-50);min-height:16px;margin-top:8px;}
.status-msg.error{color:#FF9AA5;}

.username-row{display:flex;align-items:center;gap:8px;padding:9px 12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1);border-radius:10px;font-family:var(--font-mono);font-size:13px;color:var(--ink);}
.username-row-edit{display:flex;gap:8px;max-width:360px;}
.username-row-edit input{flex:1 1 auto;min-width:0;}
.username-row-edit button{white-space:nowrap;flex-shrink:0;}
.followers-link{background:none;border:none;color:var(--ink-58);font-size:12.5px;cursor:pointer;padding:0;margin-top:10px;text-decoration:underline;}
.followers-link:hover{color:var(--ink);}

.entry-list{display:flex;flex-direction:column;gap:12px;}
.entry-card{border-radius:16px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);padding:18px 20px;display:flex;flex-direction:column;gap:8px;}
.entry-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.entry-top-left{display:flex;align-items:center;gap:10px;}
.entry-cat{font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#9AB4FF;}
.entry-time{font-size:12px;color:var(--ink-40);font-family:var(--font-mono);}
.entry-text{font-size:14.5px;line-height:1.55;color:var(--ink);margin:0;}
.entry-actions{display:flex;gap:10px;margin-top:4px;}
.entry-actions button,.entry-actions a{padding:7px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.03);color:var(--ink);font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;}
.entry-actions .save-btn{border-color:rgba(244,191,58,0.3);background:rgba(244,191,58,0.08);color:var(--gold-hi);}
.entry-actions .remove-btn{border-color:rgba(230,58,70,0.3);background:rgba(230,58,70,0.08);color:#FF9AA5;}

.row-list{display:flex;flex-direction:column;gap:10px;}
.row-item{display:grid;grid-template-columns:130px 1fr 34px;gap:10px;align-items:center;}
.row-remove{width:34px;height:34px;border-radius:8px;border:1px solid rgba(230,58,70,0.3);background:rgba(230,58,70,0.08);color:#FF9AA5;cursor:pointer;font-size:14px;}
.row-remove:hover{color:#fff;border-color:rgba(230,58,70,0.5);}
.add-row-btn{align-self:flex-start;background:none;border:1px dashed rgba(255,255,255,0.2);color:var(--ink-58);border-radius:10px;padding:8px 14px;font-size:12.5px;cursor:pointer;margin-top:4px;}
.add-row-btn:hover{color:var(--ink);border-color:rgba(77,124,255,0.4);}
.connect-toggle{padding:6px 12px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid;cursor:pointer;}
.connect-toggle.connected{background:rgba(41,91,255,0.14);border-color:rgba(77,124,255,0.4);color:var(--royal-hi);}
.connect-toggle.not-connected{background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.14);color:var(--ink-58);}

.list-item{padding:14px 0;border-top:1px solid rgba(255,255,255,0.06);}
.list-item:first-child{border-top:none;}
.list-item-top{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-40);margin-bottom:6px;flex-wrap:wrap;}
.cat-badge{padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;}
.cat-badge.music{background:rgba(41,91,255,0.14);color:var(--royal-hi);}
.cat-badge.characters{background:rgba(230,58,70,0.14);color:var(--crimson-hi);}
.cat-badge.album{background:rgba(244,191,58,0.14);color:var(--gold);}
.type-badge{padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:700;}
.type-badge.ai{background:rgba(244,191,58,0.15);color:var(--gold-hi);}
.type-badge.free{background:rgba(41,91,255,0.15);color:#9AB4FF;}
.tab-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:4px;}
.tab-header h1{font-family:var(--font-display);font-size:24px;font-weight:700;margin:0;}
.tab-sub{font-size:13.5px;color:var(--ink-50);margin:0 0 24px;}
.list-item-text{font-size:13.5px;color:var(--ink);line-height:1.5;}
.list-item-actions{display:flex;gap:10px;margin-top:8px;}
.list-item-actions button,.list-item-actions a{background:none;border:none;color:var(--royal-hi);font-size:12px;font-weight:600;cursor:pointer;padding:0;}
.list-item-actions .remove{color:#FF9AA5;}
.empty-note{font-size:13px;color:var(--ink-40);padding:8px 0;}

.results-form{display:grid;grid-template-columns:130px 100px 1fr 1fr auto;gap:10px;align-items:center;margin-bottom:20px;}
@media (max-width:900px){.results-form{grid-template-columns:1fr;}}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:50;}
.modal-backdrop.open{display:flex;}
.modal{background:rgba(12,16,28,0.98);border:1px solid rgba(77,124,255,0.25);border-radius:20px;padding:22px;width:100%;max-width:360px;max-height:70vh;overflow-y:auto;}
.modal h3{font-family:var(--font-display);font-size:15px;margin:0 0 14px;color:var(--ink);}
.follower-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,0.06);}
.follower-row:first-child{border-top:none;}
.follower-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--royal-hi),var(--royal-deep));display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:12px;color:#fff;flex:none;}
.follower-name{font-size:13px;color:var(--ink);}
.follower-handle{font-size:11.5px;color:var(--ink-40);}
.modal-close{width:100%;padding:9px;border-radius:10px;border:1px solid rgba(255,255,255,0.14);background:none;color:var(--ink);font-size:12.5px;cursor:pointer;margin-top:14px;}

.confirm-box{background:rgba(230,58,70,0.08);border:1px solid rgba(230,58,70,0.3);border-radius:14px;padding:16px;margin-top:14px;}
.confirm-box p{font-size:13px;color:var(--ink);margin:0 0 12px;}
.confirm-actions{display:flex;gap:10px;}

.state-msg{text-align:center;font-size:14px;color:var(--ink-50);padding:60px 20px;}
</style>
</head>
<body>

<div id="root">
  <p class="state-msg">Loading account…</p>
</div>

<div class="modal-backdrop" id="followersModal">
  <div class="modal">
    <h3>Followers</h3>
    <div id="followersList"></div>
    <button class="modal-close" id="closeFollowersModal">Close</button>
  </div>
</div>

<script>
(function(){
"use strict";

const CATEGORIES = [
  { id:"music", name:"Music" },
  { id:"characters", name:"Characters" },
  { id:"album", name:"Album/EP" }
];
const SOCIAL_PLATFORMS = ["YouTube","Instagram","Facebook","X (Twitter)","TikTok","Other"];
const CREATIVE_PLATFORMS = ["Suno","Emochi","DreamGen","Other"];
const NAV_ITEMS = [
  { id:"profile", label:"Profile", color:"#4D7CFF", radius:"50%" },
  { id:"history", label:"History", color:"#9AB4FF", radius:"2px" },
  { id:"favorites", label:"Favorites", color:"#FFD978", radius:"2px" },
  { id:"results", label:"Results", color:"#E63A46", radius:"2px" },
  { id:"settings", label:"Settings", color:"rgba(243,245,252,0.5)", radius:"2px" }
];

const root = document.getElementById("root");
let me = null; // /api/auth-me response
let myData = null; // /api/data response (favorites/history/profile fields via loadUserData shape)
let activeTab = (location.hash || "#profile").slice(1);

function escapeHTML(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function initials(name){
  return String(name||"?").trim().slice(0,1).toUpperCase();
}
function catName(id){
  const c = CATEGORIES.find(c=>c.id===id);
  return c ? c.name : id;
}

async function api(path, opts){
  const res = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" } }, opts || {}));
  let data = {};
  try{ data = await res.json(); }catch(e){}
  if(!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

async function init(){
  try{
    me = await api("/api/auth-me");
  }catch(e){
    root.innerHTML = '<p class="state-msg">Couldn’t reach the server.</p>';
    return;
  }
  if(!me.signedIn){
    root.innerHTML = '<p class="state-msg">You need to sign in first. <a href="index.html">Go back and sign in →</a></p>';
    return;
  }
  myData = await api("/api/data");
  render();
}

function render(){
  root.innerHTML =
    '<div class="layout">' +
      '<div class="sidebar">' +
        '<a href="index.html" class="back-link">← Back to Prompt Royale</a>' +
        '<div class="side-head">' +
          '<span class="avatar-big">'+initials(myData.profile.displayName || me.name)+'</span>' +
          '<div class="side-head-text">' +
            '<div class="side-name">'+escapeHTML(myData.profile.displayName || me.name)+'</div>' +
            '<div class="side-credits">'+(me.credits ? me.credits.remaining+" / "+me.credits.limit+" credits today" : "")+(me.tier==="scph" ? ' <span class="tier-badge">SCPH</span>' : '')+'</div>' +
          '</div>' +
        '</div>' +
        (me.credits ? '<div class="side-credits-bar"><div class="side-credits-bar-fill" style="width:'+Math.round(me.credits.remaining/me.credits.limit*100)+'%;"></div></div>' : '') +
        '<nav class="side-nav">' + NAV_ITEMS.map(navBtn).join("") + '</nav>' +
        '<hr>' +
        '<button class="signout-btn" id="signOutBtn">Sign out</button>' +
      '</div>' +
      '<div class="content" id="tabContent"></div>' +
    '</div>';

  document.querySelectorAll(".side-nav button").forEach(btn=>{
    btn.addEventListener("click", ()=>{ activeTab = btn.dataset.tab; location.hash = "#"+activeTab; renderTab(); });
  });
  document.getElementById("signOutBtn").addEventListener("click", async ()=>{
    try{ await fetch("/api/auth-logout", {method:"POST"}); }catch(e){}
    location.href = "index.html";
  });

  renderTab();
}

function navBtn(item){
  const isActive = activeTab === item.id;
  return '<button class="'+(isActive?"active":"")+'" data-tab="'+item.id+'">' +
    '<span class="nav-glyph" style="border-radius:'+item.radius+';background:'+item.color+';"></span>' + item.label +
  '</button>';
}

function renderTab(){
  document.querySelectorAll(".side-nav button").forEach(b=>b.classList.toggle("active", b.dataset.tab===activeTab));
  const el = document.getElementById("tabContent");
  if(activeTab === "history") return renderHistoryTab(el);
  if(activeTab === "favorites") return renderFavoritesTab(el);
  if(activeTab === "results") return renderResultsTab(el);
  if(activeTab === "settings") return renderSettingsTab(el);
  return renderProfileTab(el);
}

/* ---------------- Profile tab ---------------- */
function renderProfileTab(el){
  const p = myData.profile;
  el.innerHTML =
    '<div class="tab-header">' +
      '<h1>Profile</h1>' +
      '<button class="followers-link" id="followersBtn" style="margin:0;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:999px;padding:6px 14px;text-decoration:none;">' +
        '<strong style="color:var(--ink);">'+(me.followerCount||0)+'</strong> followers <span style="color:var(--ink-40);font-size:10.5px;">&middot; only visible to you</span>' +
      '</button>' +
    '</div>' +
    '<p class="tab-sub">This is how creators will see you across Prompt Royale.'+(p.handle ? '' : ' Set a username below to make your profile visible.')+'</p>' +

    '<div class="profile-media" style="position:relative;border-radius:20px;overflow:hidden;margin-bottom:56px;border:1px solid rgba(255,255,255,0.08);">' +
      '<div class="banner-slot" id="bannerSlot" style="width:100%;height:180px;">' +
        (p.bannerUrl ? '<img src="'+escapeHTML(p.bannerUrl)+'" alt="" style="width:100%;height:100%;object-fit:cover;">' : '<span>Drop a banner image</span>') +
      '</div>' +
      '<div class="avatar-slot" id="avatarSlot" style="position:absolute;left:24px;bottom:-40px;width:96px;height:96px;border-radius:50%;border:4px solid #05070d;overflow:hidden;">' +
        (p.avatarUrl ? '<img src="'+escapeHTML(p.avatarUrl)+'" alt="" style="width:100%;height:100%;object-fit:cover;">' : '<span>Photo</span>') +
      '</div>' +
    '</div>' +

    '<div class="panel">' +
      '<label class="field-label" for="fDisplayName">Display name</label>' +
      '<input type="text" id="fDisplayName" maxlength="60" value="'+escapeHTML(p.displayName||"")+'">' +
      '<button class="btn-primary small" id="saveDisplayName" style="margin-top:8px;">Save name</button>' +

      '<label class="field-label">Username</label>' +
      '<p class="hint-gold">Can only be set once — choose wisely.</p>' +
      (p.handle
        ? '<div class="username-row">🔒 @'+escapeHTML(p.handle)+'</div>'
        : '<div class="username-row-edit"><input type="text" id="fUsername" maxlength="20" placeholder="e.g. alexrivera"><button class="btn-primary small" id="saveUsername">Set Username</button></div>'
      ) +
      '<p class="status-msg" id="usernameStatus"></p>' +

      '<label class="field-label" for="fBio">Bio</label>' +
      '<textarea id="fBio" rows="3" maxlength="200" placeholder="Tell people what you create...">'+escapeHTML(p.bio||"")+'</textarea>' +
      '<div class="char-count"><span id="bioCount">'+((p.bio||"").length)+'</span> / 200</div>' +
      '<button class="btn-primary small" id="saveBio" style="margin-top:8px;">Save bio</button>' +
      '<p class="status-msg" id="profileStatus"></p>' +
    '</div>' +

    '<div class="panel">' +
      '<h2>Socials</h2>' +
      '<p class="sub">Links shown on your public profile.</p>' +
      '<div class="row-list" id="socialsList"></div>' +
      '<button class="add-row-btn" id="addSocial">+ Add social</button>' +
      '<div><button class="btn small" id="saveSocials" style="margin-top:12px;">Save</button></div>' +
      '<p class="status-msg" id="socialsStatus"></p>' +
    '</div>' +

    '<div class="panel">' +
      '<h2>Linked Creative Accounts</h2>' +
      '<p class="sub">Shows as "Also on {platform}" badges on your public profile.</p>' +
      '<div class="row-list" id="linkedList"></div>' +
      '<button class="add-row-btn" id="addLinked">+ Add account</button>' +
      '<div><button class="btn small" id="saveLinked" style="margin-top:12px;">Save</button></div>' +
      '<p class="status-msg" id="linkedStatus"></p>' +
    '</div>';

  document.getElementById("fBio").addEventListener("input", (e)=>{
    document.getElementById("bioCount").textContent = e.target.value.length;
  });

  document.getElementById("saveDisplayName").addEventListener("click", async ()=>{
    try{
      const r = await api("/api/profile", { method:"PUT", body: JSON.stringify({ displayName: document.getElementById("fDisplayName").value }) });
      myData.profile = r.profile; setStatus("profileStatus","Saved.");
      render();
    }catch(e){ setStatus("profileStatus", e.message, true); }
  });

  const usernameBtn = document.getElementById("saveUsername");
  if(usernameBtn){
    usernameBtn.addEventListener("click", async ()=>{
      try{
        const r = await api("/api/profile", { method:"PUT", body: JSON.stringify({ username: document.getElementById("fUsername").value }) });
        myData.profile = r.profile; setStatus("usernameStatus","Username set.");
        render();
      }catch(e){ setStatus("usernameStatus", e.message, true); }
    });
  }

  document.getElementById("saveBio").addEventListener("click", async ()=>{
    try{
      const r = await api("/api/profile", { method:"PUT", body: JSON.stringify({ bio: document.getElementById("fBio").value }) });
      myData.profile = r.profile; setStatus("profileStatus","Bio saved.");
    }catch(e){ setStatus("profileStatus", e.message, true); }
  });

  document.getElementById("followersBtn").addEventListener("click", openFollowersModal);

  renderRowList("socialsList", p.socials||[], "social");
  document.getElementById("addSocial").addEventListener("click", ()=>{
    p.socials = p.socials || []; p.socials.push({platform:SOCIAL_PLATFORMS[0], value:""});
    renderRowList("socialsList", p.socials, "social");
  });
  document.getElementById("saveSocials").addEventListener("click", async ()=>{
    const rows = collectRows("socialsList");
    const empty = rows.find(r=>!String(r.value||"").trim());
    if(empty){ setStatus("socialsStatus", "Handle can't be empty — remove the row or fill it in.", true); return; }
    const bad = rows.find(r=>!isValidHandle(r.value));
    if(bad){ setStatus("socialsStatus", '"'+bad.value+'" doesn\'t look like a valid handle (letters, numbers, dots, underscores, hyphens only).', true); return; }
    try{
      const r = await api("/api/profile", { method:"PUT", body: JSON.stringify({ socials: rows }) });
      myData.profile = r.profile; setStatus("socialsStatus","Saved.");
    }catch(e){ setStatus("socialsStatus", e.message, true); }
  });

  renderRowList("linkedList", p.linkedAccounts||[], "linked");
  document.getElementById("addLinked").addEventListener("click", ()=>{
    p.linkedAccounts = p.linkedAccounts || []; p.linkedAccounts.push({platform:CREATIVE_PLATFORMS[0], handle:""});
    renderRowList("linkedList", p.linkedAccounts, "linked");
  });
  document.getElementById("saveLinked").addEventListener("click", async ()=>{
    const rows = collectRows("linkedList", true);
    const empty = rows.find(r=>!String(r.handle||"").trim());
    if(empty){ setStatus("linkedStatus", "Handle can't be empty — remove the row or fill it in.", true); return; }
    const bad = rows.find(r=>!isValidHandle(r.handle));
    if(bad){ setStatus("linkedStatus", '"'+bad.handle+'" doesn\'t look like a valid handle (letters, numbers, dots, underscores, hyphens only).', true); return; }
    try{
      const r = await api("/api/profile", { method:"PUT", body: JSON.stringify({ linkedAccounts: rows }) });
      myData.profile = r.profile; setStatus("linkedStatus","Saved.");
    }catch(e){ setStatus("linkedStatus", e.message, true); }
  });
}

// Socials/linked-account fields ask for just the unique handle/username on
// each platform (not a full URL) — simpler to validate and cleaner to
// display. Letters, numbers, dots, underscores, hyphens, and an optional
// leading @; no spaces or "://" (so a pasted URL is rejected outright).
// Server-side sanitizeSocials/sanitizeLinkedAccounts apply the same check
// as a safety net (see api/_lib/store.js).
function isValidHandle(v){
  const val = String(v||"").trim();
  return /^@?[a-zA-Z0-9._-]{1,40}$/.test(val);
}

function renderRowList(containerId, rows, kind){
  const container = document.getElementById(containerId);
  const platforms = kind === "social" ? SOCIAL_PLATFORMS : CREATIVE_PLATFORMS;
  container.innerHTML = rows.map((row,i)=>{
    const opts = platforms.map(p=>'<option value="'+p+'" '+(row.platform===p?"selected":"")+'>'+p+'</option>').join("");
    const val = kind === "social" ? (row.value||"") : (row.handle||"");
    return '<div class="row-item" data-i="'+i+'"><select class="row-platform">'+opts+'</select><input type="text" class="row-value" placeholder="@handle" value="'+escapeHTML(val)+'"><button class="row-remove" data-remove="'+i+'">&times;</button></div>';
  }).join("") || '<p class="empty-note">Nothing added yet.</p>';

  container.querySelectorAll("[data-remove]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      rows.splice(Number(btn.dataset.remove), 1);
      renderRowList(containerId, rows, kind);
    });
  });
}

function collectRows(containerId, isLinked){
  const container = document.getElementById(containerId);
  return Array.from(container.querySelectorAll(".row-item")).map(row=>{
    const platform = row.querySelector(".row-platform").value;
    const value = row.querySelector(".row-value").value;
    if(isLinked){
      return { platform, handle: value };
    }
    return { platform, value };
  }).filter(r => isLinked ? r.handle : r.value);
}

function setStatus(id, text, isError){
  const el = document.getElementById(id);
  if(!el) return;
  el.textContent = text;
  el.classList.toggle("error", !!isError);
  if(!isError) setTimeout(()=>{ if(el.textContent===text) el.textContent=""; }, 3000);
}

async function openFollowersModal(){
  const modal = document.getElementById("followersModal");
  const list = document.getElementById("followersList");
  list.innerHTML = '<p class="empty-note">Loading…</p>';
  modal.classList.add("open");
  try{
    const r = await api("/api/follow");
    list.innerHTML = r.followers.length
      ? r.followers.map(f=>'<div class="follower-row"><span class="follower-avatar">'+initials(f.displayName)+'</span><div><div class="follower-name">'+escapeHTML(f.displayName)+'</div><div class="follower-handle">@'+escapeHTML(f.handle)+'</div></div></div>').join("")
      : '<p class="empty-note">No followers yet.</p>';
  }catch(e){
    list.innerHTML = '<p class="empty-note">Couldn’t load followers.</p>';
  }
}
document.getElementById("closeFollowersModal").addEventListener("click", ()=>{
  document.getElementById("followersModal").classList.remove("open");
});

/* ---------------- History / Favorites tabs ---------------- */
function renderTicketList(el, title, sub, items, opts){
  el.innerHTML = '<h1 style="font-family:var(--font-display);font-size:24px;font-weight:700;margin:0 0 4px;">'+title+'</h1>' +
    '<p class="tab-sub">'+sub+'</p>' +
    (items.length ? '<div class="entry-list">' + items.slice().reverse().slice(0,50).map((item,idx)=>{
      const realIdx = items.length-1-idx;
      const rollType = item.rollType === "ai" ? "ai" : "free";
      return '<div class="entry-card">' +
        '<div class="entry-top"><div class="entry-top-left"><span class="entry-cat">'+catName(item.categoryId)+'</span>'+
        '<span class="type-badge '+rollType+'">'+(rollType==="ai"?"AI":"Free")+'</span></div>'+
        '<span class="entry-time">'+escapeHTML(item.time||"")+'</span></div>' +
        '<p class="entry-text">'+escapeHTML(item.mission)+'</p>' +
        '<div class="entry-actions">' +
          '<button data-copy="'+realIdx+'">Copy</button>' +
          (opts.showFavorite ? '<button class="save-btn" data-fav="'+realIdx+'">Save to favorites</button>' : '') +
          (opts.showRemove ? '<button class="remove-btn" data-remove="'+realIdx+'">Remove</button>' : '') +
        '</div>' +
      '</div>';
    }).join("") + '</div>' : '<p class="empty-note">Nothing here yet.</p>');

  el.querySelectorAll("[data-copy]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const item = items[Number(btn.dataset.copy)];
      navigator.clipboard && navigator.clipboard.writeText(item.mission).then(()=>{ btn.textContent="Copied!"; setTimeout(()=>btn.textContent="Copy",1400); });
    });
  });
  el.querySelectorAll("[data-fav]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const item = items[Number(btn.dataset.fav)];
      myData.favorites = myData.favorites || [];
      if(!myData.favorites.some(f=>f.mission===item.mission)) myData.favorites.push(item);
      await api("/api/data", { method:"PUT", body: JSON.stringify({ favorites: myData.favorites, history: myData.history, settings: myData.settings, stats: myData.stats }) });
      btn.textContent = "Saved!";
    });
  });
  el.querySelectorAll("[data-remove]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const item = items[Number(btn.dataset.remove)];
      myData.favorites = (myData.favorites||[]).filter(f=>f.mission!==item.mission);
      await api("/api/data", { method:"PUT", body: JSON.stringify({ favorites: myData.favorites, history: myData.history, settings: myData.settings, stats: myData.stats }) });
      renderTab();
    });
  });
}
function renderHistoryTab(el){ renderTicketList(el, "Roll History", "Every prompt you've rolled since signing up.", myData.history||[], { showFavorite:true, showRemove:false }); }
function renderFavoritesTab(el){ renderTicketList(el, "Favorites", "Prompts you've saved for later.", myData.favorites||[], { showFavorite:false, showRemove:true }); }

/* ---------------- Results tab ---------------- */
async function renderResultsTab(el){
  el.innerHTML =
    '<h1 style="font-family:var(--font-display);font-size:24px;font-weight:700;margin:0 0 4px;">Results</h1>' +
    '<p class="tab-sub">Link the finished work you made from a prompt.</p>' +
    '<div class="panel">' +
      '<h2>Link a new result</h2>' +
      '<div class="results-form">' +
        '<select id="rCategory">'+CATEGORIES.map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join("")+'</select>' +
        '<select id="rRollType"><option value="free">Free</option><option value="ai">AI</option></select>' +
        '<input type="text" id="rPrompt" placeholder="Paste the prompt text">' +
        '<input type="url" id="rUrl" placeholder="Result link (e.g. Suno URL)">' +
        '<button class="btn-primary" id="linkResultBtn">Link It</button>' +
      '</div>' +
      '<p class="status-msg" id="resultStatus"></p>' +
    '</div>' +
    '<h2 style="font-family:var(--font-display);font-size:16px;font-weight:600;margin:0 0 14px;">Your Results</h2>' +
    '<div id="resultsListWrap"><p class="empty-note">Loading…</p></div>';

  document.getElementById("linkResultBtn").addEventListener("click", async ()=>{
    const prompt = document.getElementById("rPrompt").value.trim();
    if(!prompt){ setStatus("resultStatus","Prompt can't be empty.", true); return; }
    try{
      await api("/api/results", { method:"POST", body: JSON.stringify({
        categoryId: document.getElementById("rCategory").value,
        rollType: document.getElementById("rRollType").value,
        promptText: prompt,
        resultUrl: document.getElementById("rUrl").value.trim()
      })});
      document.getElementById("rPrompt").value = ""; document.getElementById("rUrl").value = "";
      setStatus("resultStatus","Linked!");
      loadResultsList();
    }catch(e){ setStatus("resultStatus", e.message, true); }
  });

  loadResultsList();
}
async function loadResultsList(){
  const wrap = document.getElementById("resultsListWrap");
  try{
    const r = await api("/api/results");
    wrap.innerHTML = r.results.length ? '<div class="entry-list">' + r.results.map(item=>{
      const rollType = item.roll_type === "ai" ? "ai" : "free";
      return '<div class="entry-card">' +
        '<div class="entry-top"><div class="entry-top-left"><span class="entry-cat">'+catName(item.category_id)+'</span>'+
        '<span class="type-badge '+rollType+'">'+(rollType==="ai"?"AI":"Free")+'</span></div>'+
        '<span class="entry-time">'+new Date(item.created_at).toLocaleDateString()+'</span></div>' +
        '<p class="entry-text">'+escapeHTML(item.prompt_text)+'</p>' +
        '<div class="entry-actions">' +
          (item.result_url ? '<a href="'+escapeHTML(item.result_url)+'" target="_blank" rel="noopener" class="save-btn">View Result ↗</a>' : '') +
          '<button class="remove-btn" data-remove-result="'+item.id+'">Remove</button>' +
        '</div>' +
      '</div>';
    }).join("") + '</div>' : '<p class="empty-note">Nothing linked yet.</p>';
    wrap.querySelectorAll("[data-remove-result]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        await api("/api/results?id="+btn.dataset.removeResult, { method:"DELETE" });
        loadResultsList();
      });
    });
  }catch(e){
    wrap.innerHTML = '<p class="empty-note">Couldn’t load results.</p>';
  }
}

/* ---------------- Settings tab ---------------- */
const STORE_KEY = "promptRoyale.v1";
const DEFAULT_BYOK_MODEL = { anthropic: "claude-haiku-4-5-20251001", openai: "gpt-4o-mini" };

// The reel machine's local state (favorites/history/reel toggles/AI source)
// lives in the same origin's localStorage under STORE_KEY — this only ever
// patches the AI-provider fields, never touches the rest, since this page
// doesn't load the full reel-engine state.
function readSharedState(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; }
}
function writeSharedState(patch){
  const current = readSharedState();
  Object.assign(current, patch);
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(current)); }catch(e){}
}

function renderSettingsTab(el){
  const shared = readSharedState();
  const aiSource = shared.aiSource || "off";
  const byokKeys = shared.byokKeys || { anthropic:"", openai:"" };
  const byokModels = shared.byokModels || { anthropic:"", openai:"" };

  const linked = me.linkedProviders || [me.provider];
  const providerMeta = {
    google: { label:"Google", initial:"G", gradient:"linear-gradient(135deg,#4D7CFF,#1836B2)" },
    discord: { label:"Discord", initial:"D", gradient:"linear-gradient(135deg,#E63A46,#74182D)" }
  };
  const linkQuery = new URLSearchParams(location.search);
  const linkNotice = linkQuery.get("linked") ? '<p class="status-msg" style="color:var(--gold-hi);">Account linked.</p>'
    : linkQuery.get("linkError") ? '<p class="status-msg error">'+escapeHTML(linkQuery.get("linkError"))+'</p>' : '';

  el.innerHTML =
    '<h1 style="font-family:var(--font-display);font-size:24px;font-weight:700;margin:0 0 4px;">Settings</h1>' +
    '<p class="tab-sub">Account, connections, and API access.</p>' +
    '<div class="panel">' +
      '<h2>Connected accounts</h2>' +
      '<p class="sub">Link both so you can sign in with either one.</p>' +
      linkNotice +
      '<div class="row-list">' +
        Object.keys(providerMeta).filter(p=>me.providers.includes(p)).map(p=>{
          const meta = providerMeta[p];
          const isLinked = linked.includes(p);
          return '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);">' +
            '<div style="display:flex;align-items:center;gap:10px;">' +
              '<span aria-hidden="true" style="width:26px;height:26px;border-radius:50%;background:'+meta.gradient+';display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;">'+meta.initial+'</span>' +
              '<span style="font-size:13.5px;font-weight:600;color:var(--ink);">'+meta.label+'</span>' +
            '</div>' +
            (isLinked
              ? '<span class="connect-toggle connected">Connected</span>'
              : '<button type="button" class="connect-toggle not-connected" data-connect="'+p+'" style="cursor:pointer;">Connect</button>') +
          '</div>';
        }).join("") +
      '</div>' +
    '</div>' +
    '<div class="panel">' +
      '<h2>AI-generated entries</h2>' +
      '<p class="sub">Controls the reel machine on the main page — applies next time you load it there.</p>' +
      '<select id="sAiSource">' +
        '<option value="off">Off — use the built-in lists</option>' +
        '<option value="groq">This site’s AI (Groq, no key needed)</option>' +
        '<option value="anthropic">My own Claude API key</option>' +
        '<option value="openai">My own ChatGPT (OpenAI) API key</option>' +
      '</select>' +
      '<div id="sByokFields" style="display:none;margin-top:12px;">' +
        '<label class="field-label">API key</label>' +
        '<input type="text" id="sByokKey" placeholder="sk-ant-... / sk-...">' +
        '<label class="field-label">Model (optional override)</label>' +
        '<input type="text" id="sByokModel">' +
        '<button class="btn small" id="saveAiSettings" style="margin-top:10px;">Save</button>' +
        '<p class="hint">Stored only in this browser’s local storage.</p>' +
      '</div>' +
      '<p class="status-msg" id="aiSettingsStatus"></p>' +
    '</div>' +
    '<div class="panel">' +
      '<h2>Delete Account</h2>' +
      '<p class="sub">Permanently deletes your favorites, history, profile, results, and follows. This can’t be undone.</p>' +
      '<button class="btn danger" id="deleteAccountBtn">Delete my account</button>' +
      '<div id="deleteConfirmBox"></div>' +
    '</div>';

  const sAiSource = document.getElementById("sAiSource");
  const sByokFields = document.getElementById("sByokFields");
  const sByokKey = document.getElementById("sByokKey");
  const sByokModel = document.getElementById("sByokModel");
  sAiSource.value = aiSource;

  function syncByokFieldsVisibility(){
    const src = sAiSource.value;
    const show = src === "anthropic" || src === "openai";
    sByokFields.style.display = show ? "block" : "none";
    if(show){
      sByokKey.value = byokKeys[src] || "";
      sByokModel.value = byokModels[src] || "";
      sByokModel.placeholder = DEFAULT_BYOK_MODEL[src];
    }
  }
  syncByokFieldsVisibility();

  el.querySelectorAll("[data-connect]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      location.href = "/api/auth-start?provider="+btn.dataset.connect+"&link=1";
    });
  });

  sAiSource.addEventListener("change", ()=>{
    writeSharedState({ aiSource: sAiSource.value });
    syncByokFieldsVisibility();
    setStatus("aiSettingsStatus", "Saved.");
  });

  // BYOK key/model are only written on explicit Save (not on every
  // keystroke) — avoids hammering localStorage and matches the mockup's
  // explicit "Save" affordance.
  const saveAiSettingsBtn = document.getElementById("saveAiSettings");
  if(saveAiSettingsBtn){
    saveAiSettingsBtn.addEventListener("click", ()=>{
      const src = sAiSource.value;
      if(src !== "anthropic" && src !== "openai"){
        setStatus("aiSettingsStatus", "Choose a provider above first.", true);
        return;
      }
      byokKeys[src] = sByokKey.value;
      byokModels[src] = sByokModel.value;
      writeSharedState({ byokKeys, byokModels });
      setStatus("aiSettingsStatus", "Saved.");
    });
  }

  document.getElementById("deleteAccountBtn").addEventListener("click", ()=>{
    document.getElementById("deleteConfirmBox").innerHTML =
      '<div class="confirm-box"><p>Are you sure? This permanently deletes everything and can’t be undone.</p>' +
      '<div class="confirm-actions"><button class="btn danger small" id="confirmDelete">Yes, delete everything</button><button class="btn secondary small" id="cancelDelete">Cancel</button></div></div>';
    document.getElementById("confirmDelete").addEventListener("click", async ()=>{
      try{
        await api("/api/data", { method:"DELETE" });
        location.href = "index.html";
      }catch(e){ alert(e.message); }
    });
    document.getElementById("cancelDelete").addEventListener("click", ()=>{
      document.getElementById("deleteConfirmBox").innerHTML = "";
    });
  });
}

init();
})();
</script>
